<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Install App</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;
       display:flex;flex-direction:column;align-items:center;
       justify-content:center;height:100vh;margin:0;text-align:center;padding:24px}
  a.btn{background:#3b82f6;color:#fff;padding:14px 28px;border-radius:8px;
        text-decoration:none;font-weight:600;margin-top:16px}
  .hint{opacity:.6;font-size:14px;margin-top:12px;max-width:320px}
  .warn{background:#7f1d1d;padding:12px;border-radius:8px;
        font-size:14px;max-width:320px}
</style>
</head>
<body>
<h2 id="title">Installing…</h2>
<p class="hint" id="hint">If nothing happens in a few seconds, tap the button.</p>
<div id="inapp" class="warn" style="display:none">
  In-app browser detected. APK downloads often fail here — open this page in Chrome.
</div>
<a class="btn" id="btn" href="app.apk" type="application/vnd.android.package-archive">
  Download APK
</a>

<script>
const VERSION = '1.0.0';           // bump on every release
const APK     = 'app.apk';
const ua      = navigator.userAgent;

// in-app webview detection
const inApp = /Instagram|FBAN|FBAV|FB_IAB|Messenger|TikTok|Line\/|Twitter/i.test(ua);
if (inApp) document.getElementById('inapp').style.display = 'block';

const seen = localStorage.getItem('dlv');
if (seen === VERSION) {
  document.getElementById('title').textContent = 'Already downloaded';
  document.getElementById('hint').textContent  = 'v' + VERSION + ' — tap to download again.';
} else {
  localStorage.setItem('dlv', VERSION);
  window.addEventListener('load', () => {
    // same-origin iframe avoids racing the page navigation
    const f = document.createElement('iframe');
    f.src = APK; f.hidden = true;
    document.body.appendChild(f);
    // intent fallback fires the installer sheet directly
    setTimeout(() => {
      location.href = 'intent://' + location.host + location.pathname + APK +
        '#Intent;scheme=https;type=application/vnd.android.package-archive;end';
    }, 4000);
  });
}
</script>
</body>
</html>
